<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Prep</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fb;color:#1c2333}header{background:#1f4fd1;color:#fff;padding:16px 20px}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;background:#fff;box-shadow:0 1px 4px #0001}nav button{border:0;padding:8px 14px;border-radius:8px;background:#e8eefc;cursor:pointer;font-weight:600}
nav button.on{background:#1f4fd1;color:#fff}main{max-width:860px;margin:20px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 4px #0001}
textarea{width:100%;min-height:180px;font:inherit;padding:10px;box-sizing:border-box}.btn{background:#1f4fd1;color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;margin:4px 4px 0 0}
.q{margin:10px 0}.ok{color:#127a2e}.bad{color:#b3261e}#timer{font-size:28px;font-weight:700}small{color:#667}
</style></head><body><header><h1 style="margin:0">IELTS Prep</h1><small style="color:#dde">Speaking · Writing · Reading · Vocabulary</small></header>
<nav id="nav"></nav><main id="app"></main><script>
const S={speaking:[["Part 1","Do you work or are you a student?","What do you like about your hometown?","How do you usually spend your weekends?"],["Part 2 (1 min prep, 2 min talk)","Describe a book you enjoyed reading. Say what it was, when you read it, what it was about, and explain why you liked it.","Describe a place you would like to visit. Say where it is, how you know about it, what you would do there, and why."],["Part 3","Do you think reading habits have changed in recent years?","How does tourism affect local communities?"]],
writing:["Task 2: Some people believe universities should focus on job skills, others think they should provide general knowledge. Discuss both views and give your opinion.","Task 2: In many countries, people are living longer. What problems does this cause, and what solutions can you suggest?","Task 1 (letter): Write to your landlord about a problem in your apartment."],
reading:{text:"Urban green spaces provide more than recreation. Studies show that parks lower city temperatures by up to 3°C, reduce air pollution, and improve residents' mental health. However, many cities struggle to fund their maintenance, and some parks are being sold to developers.",qs:[["Parks can reduce city temperatures.","TRUE"],["All cities have enough money to maintain parks.","FALSE"],["Parks increase property prices.","NOT GIVEN"]]},
vocab:[["mitigate","make less severe"],["substantial","large in amount"],["detrimental","harmful"],["prevalent","widespread"],["advocate","publicly support"],["inevitable","certain to happen"],["deteriorate","become worse"],["feasible","possible to do"]]};
const tabs={Speaking:speak,Writing:write,Reading:read,Vocabulary:vocab};let cur="Speaking";const app=document.getElementById('app');
function nav(){document.getElementById('nav').innerHTML=Object.keys(tabs).map(t=>`<button class="${t==cur?'on':''}" onclick="go('${t}')">${t}</button>`).join('')}
function go(t){cur=t;nav();tabs[t]()}
let rec,tm;function speak(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
app.innerHTML=S.speaking.map(p=>`<div class="card"><h3>${p[0]}</h3>${p.slice(1).map(q=>`<div class="q">• ${q}</div>`).join('')}</div>`).join('')+
`<div class="card"><h3>Practice answer</h3><div id="timer">0:00</div><button class="btn" onclick="startRec()">🎤 Start</button><button class="btn" onclick="stopRec()">■ Stop</button>
<p id="tr"><small>${SR?'Your speech transcript appears here.':'Speech recognition not supported in this browser (try Chrome).'}</small></p><p id="st"></p></div>`}
function startRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;let t0=Date.now();
clearInterval(tm);tm=setInterval(()=>{let s=Math.floor((Date.now()-t0)/1000);timer.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500);
rec.onresult=e=>{let txt=[...e.results].map(r=>r[0].transcript).join(' ');tr.textContent=txt;let w=txt.trim().split(/\s+/).length,s=(Date.now()-t0)/60000;st.innerHTML=`<small>${w} words · ~${Math.round(w/Math.max(s,.05))} wpm (aim 120–160)</small>`};rec.start()}
function stopRec(){rec&&rec.stop();clearInterval(tm)}
function write(){const p=S.writing[Math.floor(Math.random()*S.writing.length)];app.innerHTML=`<div class="card"><h3>Writing</h3><p>${p}</p><textarea id="ta" oninput="wc.textContent=this.value.trim().split(/\\s+/).filter(Boolean).length+' words (Task 2 min 250, Task 1 min 150)'"></textarea><p id="wc"><small>0 words</small></p><button class="btn" onclick="go('Writing')">New prompt</button></div>`}
function read(){const r=S.reading;app.innerHTML=`<div class="card"><h3>Reading – TRUE / FALSE / NOT GIVEN</h3><p>${r.text}</p>${r.qs.map((q,i)=>`<div class="q">${i+1}. ${q[0]}<br>${["TRUE","FALSE","NOT GIVEN"].map(o=>`<label><input type=radio name=q${i} value="${o}"> ${o}</label> `).join('')} <span id="r${i}"></span></div>`).join('')}<button class="btn" onclick="chk()">Check</button></div>`}
function chk(){S.reading.qs.forEach((q,i)=>{const v=(document.querySelector(`[name=q${i}]:checked`)||{}).value;document.getElementById('r'+i).innerHTML=v==q[1]?'<b class=ok>✓</b>':`<b class=bad>✗ ${q[1]}</b>`})}
let vi=0;function vocab(){const v=S.vocab[vi%S.vocab.length];app.innerHTML=`<div class="card"><h3>Vocabulary flashcard ${vi%S.vocab.length+1}/${S.vocab.length}</h3><h2>${v[0]}</h2><p id="m" style="visibility:hidden">${v[1]}</p><button class="btn" onclick="m.style.visibility='visible'">Show meaning</button><button class="btn" onclick="vi++;vocab()">Next</button></div>`}
go(cur);</script></body></html>
